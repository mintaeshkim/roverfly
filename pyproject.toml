[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roverfly"
version = "0.1.0"
description = "Robust reinforcement-learning control for quadrotor-payload systems"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "glfw>=2.8,<3",
    "gymnasium>=0.29,<1",
    "imageio>=2.34,<3",
    "mujoco>=3.2,<4",
    "numpy>=1.26,<3",
    "rich>=13,<15",
    "scipy>=1.12,<2",
    "stable-baselines3>=2.2,<3",
    "tensorboard>=2.16,<3",
    "torch>=2.2,<3",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4", "pandas>=2.1,<3"]
export = ["onnx>=1.16,<2", "onnxruntime>=1.17,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
roverfly = "roverfly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roverfly = ["assets/**/*.xml", "assets/images/*.png", "models/*.onnx"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not integration'"
testpaths = ["tests"]
markers = ["integration: requires a working MuJoCo/OpenGL runtime"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/roverfly/integrations/ros1.py" = ["E701"]
